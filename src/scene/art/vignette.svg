      <rect x="90" y="345" width="120" height="40" rx="3" fill="#f4f1e6" stroke="#3b2a20" stroke-width="2"/>
      <g id="papers-top"><rect x="100" y="335" width="100" height="12" rx="2" fill="#fffdf6" stroke="#3b2a20" stroke-width="2"/></g>
    </g>
  </a>
  <a id="link-person" href="#about" aria-label="About me">
    <g id="person">
      <circle cx="300" cy="345" r="32" fill="#f0c9a5" stroke="#3b2a20" stroke-width="2"/>
      <g id="hair" data-pivot="290 330"><path d="M268 340 q10-40 50-30 q-20 5-22 25z" fill="#1f1d22"/></g>
      <rect x="330" y="330" width="190" height="55" rx="26" fill="#f6f6f2" stroke="#3b2a20" stroke-width="2"/>
      <path d="M520 360 l70-60 l70 85" fill="none" stroke="#3a4258" stroke-width="26" stroke-linejoin="round"/>
    </g>
  </a>
  <a id="link-book" href="/writing/" aria-label="Writing">
    <g id="book">
      <rect x="380" y="255" width="90" height="60" rx="3" fill="#a3533d" stroke="#3b2a20" stroke-width="2"/>
      <g id="book-page" data-pivot="425 285"><rect x="425" y="260" width="40" height="50" fill="#fffaf0" stroke="#3b2a20" stroke-width="1.5"/></g>
