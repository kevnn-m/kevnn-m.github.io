<svg id="vignette" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420">
  <!-- TEMPORARY placeholder shapes; replaced by the final illustration. -->
  <a id="link-papers" href="/publications/" aria-label="Publications">
