- id: cora
  title: "CoRA: Confidence-Rationale Alignment for Reliable Chain-of-Thought Reasoning"
  authors:
    - "Juming Xiong"
    - "Weixin Liu"
    - "Kevin Guo"
    - "Congning Ni"
    - "Junchao Zhu"
    - "Chongyu Qu"
    - "Chao Yan"
    - "Katherine Brown"
    - "Avinash Baidya"
    - "Xiang Gao"
    - "Bradley Malin"
    - "Zhijun Yin"
  venue: "arXiv preprint"
  venueDetail: "arXiv:2606.14961"
  status: preprint
  date: "2026-06"
  tldr: "A GRPO-based reinforcement learning method that rewards answer correctness, answer confidence, and rubric-judged rationale support reduces confidence-rationale misalignment by up to 26.51% on MedQA, MathQA, and OpenBookQA while keeping accuracy competitive."
  figure: ./pubs/cora.png
  figureAlt: "An example of confidence–rationale misalignment."
  selected: false
  links:
    paper: https://arxiv.org/abs/2606.14961
    pdf: https://arxiv.org/pdf/2606.14961

- id: conformity-uncertainty
  title: "It's Not Always Sycophancy: Measuring LLM Conformity as a Function of Epistemic Uncertainty"
  authors:
    - "Kevin H. Guo"
    - "Chao Yan"
    - "Avinash Baidya"
    - "Katherine Brown"
    - "Xiang Gao"
    - "Juming Xiong"
    - "Zhijun Yin"
    - "Bradley A. Malin"
  venue: "arXiv preprint"
  venueDetail: "arXiv:2605.27288"
  status: preprint
  date: "2026-05"
  tldr: "Introduces MUSE, a two-stage framework that maps an LLM's epistemic uncertainty against its likelihood of yielding to user pushback, separating sycophantic conformity from uncertainty-driven conformity."
  figure: ./pubs/conformity-uncertainty.png
  figureAlt: "The MUSE Framework."
  selected: true
  links:
    paper: https://arxiv.org/abs/2605.27288
    pdf: https://arxiv.org/pdf/2605.27288

- id: clear
  title: "CLEAR: Revealing How Noise and Ambiguity Degrade Reliability in LLMs for Medicine"
  authors:
    - "Kevin H. Guo"
    - "Chao Yan"
    - "Avinash Baidya"
    - "Katherine Brown"
    - "Xiang Gao"
    - "Juming Xiong"
    - "Zhijun Yin"
    - "Bradley A. Malin"
  venue: "arXiv preprint"
  venueDetail: "arXiv:2605.01011"
  status: preprint
  date: "2026-05"
  tldr: "CLEAR perturbs the number of plausible options, whether a correct or abstention option is present, and option framing on three medical benchmarks across 17 LLMs, showing more plausible answers and \"I don't know\" framing reduce reliability, with a humility deficit that worsens with scale."
  figure: ./pubs/clear.png
  figureAlt: "Overview of the CLEAR evaluation framework."
  selected: true
  links:
    paper: https://arxiv.org/abs/2605.01011
    pdf: https://arxiv.org/pdf/2605.01011

- id: stop-listening
