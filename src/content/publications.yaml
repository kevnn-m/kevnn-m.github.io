  authors:
    - "Kevin H. Guo"
    - "Chao Yan"
    - "Avinash Baidya"
    - "Katherine Brown"
    - "Xiang Gao"
    - "Juming Xiong"
    - "Zhijun Yin"
    - "Bradley A. Malin"
  venue: "arXiv preprint"
  venueDetail: "arXiv:2603.11394"
  status: preprint
  date: "2026-03"
  tldr: "Evaluating 17 LLMs on three clinical benchmarks with a \"stick-or-switch\" framework, the paper finds that spreading a question's answer options across conversation turns lowers accuracy and abstention against incorrect suggestions by up to 30% on average."
